name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run pytest -q

  mcpb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: npx -y @anthropic-ai/mcpb@2.1.2 pack . "$RUNNER_TEMP/creatorloop.mcpb"
      - name: The unpacked bundle starts the way Claude Desktop runs it (settings left empty)
        run: |
          unzip -q "$RUNNER_TEMP/creatorloop.mcpb" -d "$RUNNER_TEMP/bundle"
          mapfile -t args < <(jq -r '.server.mcp_config.args[]' manifest.json | sed "s|\${__dirname}|$RUNNER_TEMP/bundle|")
          IG_ACCESS_TOKEN= IG_USER_ID= CREATORLOOP_HOME="$RUNNER_TEMP/home" \
            python3 .github/scripts/mcp_smoke.py 34 "$(jq -r .server.mcp_config.command manifest.json)" "${args[@]}"
      - uses: actions/upload-artifact@v4 # for trying the bundle in Claude Desktop before a release
        with:
          name: creatorloop-mcpb
          path: ${{ runner.temp }}/creatorloop.mcpb

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t creatorloop .
      - run: python3 .github/scripts/mcp_smoke.py 34 docker run -i --rm creatorloop
